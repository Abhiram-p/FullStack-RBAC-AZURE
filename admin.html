<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/home.css">
    <style>
        body{
            position: relative;
            width: 100%;
            min-height: 100vh;
            height: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e8e8e8;
            font-family: 'roboto', sans-serif;
            overflow-x: hidden;
        }

        /* ── Animation Keyframes ── */
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes slideInLeft {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeInCenter {
            from { transform: translate(-50%, -40%); opacity: 0; }
            to { transform: translate(-50%, -50%); opacity: 1; }
        }

        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* ── SVG background layer ── */
        .bg-semicircle {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: auto;
            pointer-events: none;
            z-index: 0;
            animation: slideUp 1s ease-out forwards;
        }

        .bg-girl {
            position: fixed;
            bottom: 60px;
            left: -20px;
            width: clamp(150px, 22vw, 380px);
            height: auto;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            animation: slideInLeft 1s ease-out 0.3s forwards;
        }

        .bg-boy {
            position: fixed;
            bottom: 60px;
            right: -20px;
            width: clamp(130px, 20vw, 340px);
            height: auto;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            animation: slideInRight 1s ease-out 0.3s forwards;
        }

        .bg-lock {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(150px, 22vw, 360px);
            height: auto;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            animation: fadeInCenter 1.2s ease-out 0.5s forwards;
        }

        .container { 
            position: relative;
            z-index: 10;
            flex-direction: column; 
            height: auto; 
            min-height: 87vh; 
            width: 95%;
            max-width: 1200px;
            padding: clamp(15px, 3vw, 30px); 
            justify-content: flex-start;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 10px;
            margin: 20px auto;
            overflow: hidden;
            opacity: 0;
            animation: scaleIn 0.8s ease-out 1s forwards;
        }

        .controls { 
            margin: 20px 0; 
            width: 100%; 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
        }

        input { padding: 10px; border-radius: 5px; border: none; flex: 1; min-width: 200px; }
        
        .btn { 
            padding: 10px 20px; 
            border-radius: 5px; 
            border: none; 
            cursor: pointer; 
            background: #fff; 
            color: #000;
            font-size: 14px;
            white-space: nowrap;
        }

        #section-users, #section-groups, #section-logs {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
        }

        table { 
            width: 100%; 
            min-width: 700px;
            border-collapse: collapse; 
            color: #fff; 
            background: rgba(255, 255, 255, 0.05); 
        }

        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        th { background: rgba(255, 255, 255, 0.15); text-transform: capitalize; }
        
        .ban-btn { background: #ff4747; color: #fff; }
        .unban-btn { background: #47ff78; color: #000; }
        .delete-btn { background: #9b0000; color: #fff; margin-left: 5px; }
        
        select { background: rgba(255, 255, 255, 0.2); color: #fff; border: none; padding: 5px; border-radius: 3px; }
        option { background: #333; }

        .tabs { display: flex; gap: 20px; margin-top: 20px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; width: 100%; }
        .tab { cursor: pointer; opacity: 0.6; color: #fff; text-transform: uppercase; font-weight: bold; font-size: 14px; }
        .tab.active { opacity: 1; border-bottom: 2px solid #fff; }
        .hidden { display: none; }

        .permission-list {
            width: 100%;
            max-width: 400px;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .permission-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 5px;
            color: #fff;
            font-size: 14px;
        }
        .permission-item input {
            flex: none;
            min-width: auto;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .bg-girl, .bg-boy { display: none; }
            .greeting { font-size: 28px; }
            .tab { font-size: 12px; gap: 10px; }
            .container { padding: 15px; }
        }
    </style>
</head>
<body>

    <!-- Background SVG layers -->
    <img class="bg-semicircle" src="img/bg_semicircle.svg" alt="">
    <img class="bg-girl"       src="img/bg_girl.svg"       alt="">
    <img class="bg-boy"        src="img/bg_boy.svg"        alt="">
    <img class="bg-lock"       src="img/bg_lock.svg"       alt="">

    <div class="container">
        <button class="logout">log out</button>
        <h1 class="greeting" style="color: #fff;">Admin Dashboard</h1>
        
        <div class="tabs">
            <div class="tab active" id="tab-users" onclick="showTab('users')">Users</div>
            <div class="tab" id="tab-groups" onclick="showTab('groups')">Groups</div>
            <div class="tab" id="tab-logs" onclick="showTab('logs')">Audit Logs</div>
        </div>

        <div id="section-users">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Reg. Type</th>
                        <th>Role</th>
                        <th>Group</th>
                        <th>Last Login</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="user-table-body"></tbody>
            </table>
        </div>

        <div id="section-groups" class="hidden">
            <div class="controls" style="flex-direction: column; align-items: flex-start;">
                <input type="text" id="new-group-name" placeholder="New Group Name" style="width: 100%; max-width: 400px;">
                
                <div class="permission-list">
                    <div class="permission-item">
                        <span>Can Ban/Unban Users</span>
                        <input type="checkbox" id="p-ban">
                    </div>
                    <div class="permission-item">
                        <span>Can Delete Users Permanently</span>
                        <input type="checkbox" id="p-delete">
                    </div>
                    <div class="permission-item">
                        <span>Can Change User Roles</span>
                        <input type="checkbox" id="p-role">
                    </div>
                    <div class="permission-item">
                        <span>Can Assign Groups/Teams</span>
                        <input type="checkbox" id="p-group">
                    </div>
                    <div class="permission-item">
                        <span>Can View Audit Logs</span>
                        <input type="checkbox" id="p-logs">
                    </div>
                </div>
                
                <button class="btn" onclick="createGroup()" id="group-submit-btn">Create Group with Permissions</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Group Name</th>
                        <th>Permissions</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="group-table-body"></tbody>
            </table>
        </div>

        <div id="section-logs" class="hidden">
            <table>
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Action</th>
                        <th>Target User</th>
                        <th>Performed By</th>
                    </tr>
                </thead>
                <tbody id="log-table-body"></tbody>
            </table>
        </div>
    </div>
    <script src="js/admin.js"></script>
</body>
</html>
