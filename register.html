<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>

    <link rel="stylesheet" href="css/form.css">

</head>
<body>

    <!-- Fixed background layers -->
    <img class="bg-semicircle" src="img/bg_semicircle.svg" alt="">
    <img class="bg-girl"       src="img/bg_girl.svg"       alt="">
    <img class="bg-boy"        src="img/bg_boy.svg"        alt="">

    <div class="alert-box">
        <p class="alert"></p>
    </div>

    <div class="lock-form-wrapper">
        <img class="bg-lock" src="img/bg_lock.svg" alt="">
        <div class="form">
            <h1 class="heading">Register</h1>
            <input type="text" placeholder="name" autocomplete="off" class="name" required>
            <input type="email" placeholder="email" autocomplete="off" class="email" required>
            <input type="password" placeholder="password" autocomplete="off" class="password" required>
            <button class="submit-btn">register</button>
            <a href="/login" class="link">already have an account ? log in here</a>
        </div>
    </div>

    <script src="js/form.js"></script>
    
</body>
</html>
